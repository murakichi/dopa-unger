<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>6秒耐えろ！ドーパミン・アンガー</title>
<style>
:root{--font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:var(--font);color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .4s}
body.bless #hud{opacity:0}
#timer{position:absolute;top:2.5vh;left:50%;transform:translateX(-50%);font-weight:900;font-size:min(20vw,130px);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;text-shadow:0 0 20px #0ff,0 0 50px #08f,0 4px 0 rgba(0,0,0,.5)}
#timer.hot{color:#ffe14d;text-shadow:0 0 20px #f80,0 0 50px #f40,0 4px 0 rgba(0,0,0,.5)}
#timer.crit{color:#ff4d4d;text-shadow:0 0 20px #f00,0 0 60px #f00,0 4px 0 rgba(0,0,0,.5);animation:jit .08s infinite}
#timer.bump{animation:bump .3s ease-out}
@keyframes bump{0%{transform:translateX(-50%) scale(1.5)}100%{transform:translateX(-50%) scale(1)}}
@keyframes jit{0%{transform:translateX(-50%) translate(2px,-2px)}50%{transform:translateX(-50%) translate(-3px,2px)}100%{transform:translateX(-50%) translate(2px,3px)}}
#bar{position:absolute;left:0;top:0;height:8px;width:100%;background:linear-gradient(90deg,#0ff,#ff0,#f0f);transform-origin:left;box-shadow:0 0 16px #fff}
#score{position:absolute;top:2vh;left:3vw;font-weight:900;font-size:min(7vw,36px);text-shadow:0 0 12px #f0f,0 3px 0 rgba(0,0,0,.5)}
#score small{display:block;font-size:.4em;opacity:.7;letter-spacing:.2em}
#combo{position:absolute;top:2vh;right:3vw;text-align:right;font-weight:900;font-size:min(7vw,36px);color:#ffe14d;opacity:0;text-shadow:0 0 14px #f80,0 3px 0 rgba(0,0,0,.5)}
#combo.on{opacity:1}
#combo.pop{animation:cpop .2s ease-out}
@keyframes cpop{0%{transform:scale(1.7)}100%{transform:scale(1)}}
#combo small{font-size:.45em;letter-spacing:.15em}
#rage{position:absolute;top:min(26vw,150px);left:50%;transform:translateX(-50%);font-weight:900;color:#ff2b2b;font-size:min(6vw,28px);
  letter-spacing:.2em;text-shadow:0 0 14px #f00;opacity:0;animation:blink .4s infinite alternate}
#rage.on{opacity:1}
@keyframes blink{to{filter:brightness(2)}}
#banner{position:fixed;left:0;right:0;bottom:12vh;text-align:center;pointer-events:none;font-weight:900;font-size:min(11vw,64px);
  opacity:0;text-shadow:0 0 20px #f0f,0 5px 0 rgba(0,0,0,.6)}
#banner small{display:block;font-size:.35em;letter-spacing:.2em;margin-top:.4em}
#banner.go{animation:banner 1.6s ease-out}
@keyframes banner{0%{opacity:0;transform:scale(2.4)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.9) translateY(-20px)}}

/* cut-in (pachislot style) */
#cutin{position:fixed;inset:0;pointer-events:none;display:none;overflow:hidden}
#cutin.go{display:block}
#cutin>*{position:absolute;will-change:transform,opacity}
#cutin .vig{inset:0;background:radial-gradient(circle,transparent 30%,rgba(255,0,0,.75) 100%);opacity:0}
#cutin.go .vig{animation:vig .35s ease-in-out 6 alternate}
@keyframes vig{0%{opacity:.2}100%{opacity:1}}
#cutin .rays{left:50%;top:50%;width:250vmax;height:250vmax;margin:-125vmax 0 0 -125vmax;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,240,120,.85) 0 6deg,rgba(255,30,0,.55) 6deg 12deg,rgba(0,0,0,.6) 12deg 18deg)}
#cutin.go .rays{animation:rays 2.4s linear}
@keyframes rays{0%{opacity:0;transform:rotate(0) scale(.2)}10%{opacity:.75;transform:rotate(30deg) scale(1)}85%{opacity:.6;transform:rotate(300deg) scale(1)}100%{opacity:0;transform:rotate(360deg) scale(1)}}
#cutin .flash{inset:0;background:#fff;opacity:0}
#cutin.go .flash{animation:flick 2.4s steps(1) }
@keyframes flick{0%{opacity:1;background:#fff}3%{opacity:0}6%{opacity:1;background:#f00}9%{opacity:0}12%{opacity:1;background:#ff0}15%{opacity:0}30%{opacity:.85;background:#fff}33%{opacity:0}55%{opacity:.6;background:#f00}58%{opacity:0}100%{opacity:0}}
#cutin .bar{left:-10%;right:-10%;height:min(5vh,40px);background:linear-gradient(#fff2a0,#f5b400 50%,#a06000);box-shadow:0 0 30px #ff0}
#cutin .bar.t{top:calc(50% - min(19vh,150px));transform:rotate(-6deg)}
#cutin .bar.b{top:calc(50% + min(14vh,110px));transform:rotate(-6deg)}
#cutin.go .bar{animation:barin 2.4s cubic-bezier(.1,.8,.2,1)}
#cutin .band{left:-15%;right:-15%;top:50%;height:min(30vh,240px);margin-top:min(-15vh,-120px);
  background:repeating-linear-gradient(115deg,#000 0 30px,#c00000 30px 60px);box-shadow:0 0 80px #f00,inset 0 0 60px #000;
  transform:rotate(-6deg);display:flex;align-items:center;justify-content:center}
#cutin.go .band{animation:barin 2.4s cubic-bezier(.1,.8,.2,1)}
@keyframes barin{0%{transform:rotate(-6deg) translateX(-130%) scaleY(.3)}10%{transform:rotate(-6deg) translateX(0) scaleY(1.25)}14%{transform:rotate(-6deg) translateX(0) scaleY(1)}90%{transform:rotate(-6deg) translateX(0)}100%{transform:rotate(-6deg) translateX(140%)}}
#cutin .txt{left:0;right:0;top:50%;margin-top:min(-10vh,-80px);text-align:center;transform:rotate(-6deg);font-weight:900;white-space:nowrap;
  font-size:min(9.6vw,100px);line-height:1.2;color:#fff;letter-spacing:-.03em;-webkit-text-stroke:min(1.2vw,10px) #000;paint-order:stroke fill;
  text-shadow:0 0 30px #ff0,0 0 60px #f00,8px 8px 0 #f00}
#cutin .txt::before,#cutin .txt::after{content:attr(data-t);position:absolute;inset:0;-webkit-text-stroke:0;text-shadow:none;mix-blend-mode:screen;opacity:.85}
#cutin .txt::before{color:#0ff;transform:translate(-6px,3px)}
#cutin .txt::after{color:#f0f;transform:translate(6px,-3px)}
#cutin.go .txt{animation:txt 2.4s linear}
@keyframes txt{0%,4%{opacity:0;transform:rotate(-6deg) scale(7)}10%{opacity:1;transform:rotate(-6deg) scale(.85)}14%{transform:rotate(-6deg) scale(1.15)}18%{transform:rotate(-6deg) scale(1)}
 22%,34%,46%,58%,70%,82%{transform:rotate(-6deg) translate(9px,-7px) scale(1.08)}28%,40%,52%,64%,76%,88%{transform:rotate(-6deg) translate(-10px,6px) scale(1.03)}
 90%{opacity:1;transform:rotate(-6deg)}100%{opacity:0;transform:rotate(-6deg) scale(1.6)}}
#cutin .sub{left:0;right:0;top:calc(50% - min(29vh,230px));text-align:center;font-weight:900;font-size:min(7vw,44px);letter-spacing:.3em;color:#ffe14d;
  -webkit-text-stroke:min(.8vw,6px) #500;paint-order:stroke fill;text-shadow:0 0 20px #f80;opacity:0}
#cutin.go .sub{animation:sub 2.4s steps(1)}
@keyframes sub{0%,12%{opacity:0}14%,20%,26%,32%,38%,44%,50%,56%,62%,68%,74%,80%{opacity:1}17%,23%,29%,35%,41%,47%,53%,59%,65%,71%,77%,83%{opacity:.15}86%,100%{opacity:0}}
#cutin .stamp{right:6vw;bottom:14vh;font-weight:900;font-size:min(14vw,110px);color:#ffe14d;-webkit-text-stroke:min(1vw,8px) #700;paint-order:stroke fill;
  text-shadow:0 0 30px #f00,6px 6px 0 #a00;opacity:0;letter-spacing:.05em}
#cutin.go .stamp{animation:stamp2 2.4s linear}
@keyframes stamp2{0%,34%{opacity:0;transform:scale(5) rotate(20deg)}40%{opacity:1;transform:scale(1) rotate(-12deg)}44%{transform:scale(1.25) rotate(-12deg)}48%,88%{opacity:1;transform:scale(1) rotate(-12deg)}100%{opacity:0;transform:scale(1.4) rotate(-12deg)}}

/* result */
.overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:16px}
#result{background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#result.show{display:flex}
#result .lab{letter-spacing:.4em;opacity:.8;font-weight:700}
#rscore{font-weight:900;font-size:min(22vw,140px);font-variant-numeric:tabular-nums;line-height:1;
  background:linear-gradient(#fff,#ffe14d 60%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px #f80)}
#rrank{font-weight:900;font-size:min(9vw,48px);opacity:0;color:#0ff;text-shadow:0 0 20px #0ff}
#rrank.show{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(4) rotate(-12deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}
#q{opacity:0;transform:translateY(20px);transition:all .5s;pointer-events:none}
#q.show{opacity:1;transform:none;pointer-events:auto}
#q h2{margin:.4em 0 .6em;font-size:min(13vw,80px);font-weight:900;text-shadow:0 0 24px #fff}
.btns{display:flex;gap:4vw;justify-content:center}
.btn{font:inherit;font-weight:900;font-size:min(8vw,36px);padding:.5em 1.6em;border:0;border-radius:999px;cursor:pointer;color:#fff;
  box-shadow:0 8px 0 rgba(0,0,0,.4),0 0 30px currentColor;transition:transform .1s;touch-action:manipulation}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn.yes{background:linear-gradient(#7ee8fa,#4a8cff)}
.btn.no{background:linear-gradient(#ff7a7a,#c40000)}
.btn{animation:throb 1s ease-in-out infinite alternate}
@keyframes throb{to{filter:brightness(1.3);transform:scale(1.05)}}

/* bless */
#bless{color:#7a5c1e;pointer-events:none}
#bless.show{display:flex}
#bless h1{margin:0;font-weight:900;font-size:min(16vw,120px);letter-spacing:.05em;display:flex;justify-content:center;flex-wrap:wrap}
#bless h1 span{display:inline-block;opacity:0;background:linear-gradient(#fff6c8,#f3c04d 55%,#c48a1c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,214,102,.9)) drop-shadow(0 2px 2px rgba(150,100,10,.35));animation:rise 1.4s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(40px) scale(.6);filter:blur(12px)}100%{opacity:1;transform:none}}
#bless p{margin:0;font-weight:700;font-size:min(5vw,26px);letter-spacing:.2em;opacity:0;animation:fade 2s 2.2s ease-out forwards}
#bless .again{pointer-events:auto;opacity:0;margin-top:3vh;animation:fade 2s 6s ease-out forwards;font:inherit;font-weight:700;color:#7a5c1e;
  background:rgba(255,255,255,.7);border:2px solid #f0c860;border-radius:999px;padding:.6em 2em;font-size:min(4.5vw,20px);cursor:pointer;letter-spacing:.15em}
@keyframes fade{to{opacity:1}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="hud">
  <div id="bar"></div>
  <div id="score"><small>SCORE</small><span id="scv">0</span></div>
  <div id="timer">6.00</div>
  <div id="combo"><span id="cn">0</span><small> COMBO</small></div>
  <div id="rage">RAGE MODE ×2</div>
</div>
<div id="banner"></div>

<div id="cutin"><div class="vig"></div><div class="rays"></div><div class="bar t"></div><div class="band"></div><div class="bar b"></div>
  <div class="sub">激 アツ ！！</div><div class="txt" data-t="殺しちまえ！！！！！">殺しちまえ！！！！！</div><div class="stamp">確定!!</div><div class="flash"></div></div>

<div id="result" class="overlay">
  <div class="lab">SCORE</div>
  <div id="rscore">0</div>
  <div id="rrank"></div>
  <div id="q">
    <h2>収まった？</h2>
    <div class="btns">
      <button class="btn yes" id="yes">はい</button>
      <button class="btn no" id="no">いいえ</button>
    </div>
  </div>
</div>

<div id="bless" class="overlay">
  <h1 id="btitle"></h1>
  <p>6秒、よく耐えました</p>
  <button class="again" id="again">もう一度あそぶ</button>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#fx'), ctx = cv.getContext('2d');
let W, H, DPR = 1;
function resize(){
  const d = DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize); resize();
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ---------- audio ---------- */
let AC, master;
function audio(){
  if (!AC){
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor();
      master = AC.createGain(); master.gain.value = .7;
      master.connect(comp); comp.connect(AC.destination);
    } catch (e) {}
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d = .15, type = 'sine', v = .2, slide = 0, delay = 0, att = .01){
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + att);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);
}
function noise(d = .3, v = .3, freq = 1000, type = 'lowpass', delay = 0){
  if (!AC) return;
  const t = AC.currentTime + delay, n = AC.sampleRate * d | 0;
  const buf = AC.createBuffer(1, n, AC.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
const PENTA = [0, 2, 4, 7, 9];
const note = i => 261.63 * 2 ** ((PENTA[i % 5] + 12 * (i / 5 | 0)) / 12);
function bell(f, delay = 0, v = .16){
  tone(f, 2.4, 'sine', v, 0, delay, .005);
  tone(f * 2.76, 1.2, 'sine', v * .25, 0, delay, .005);
  tone(f * 4.1, .6, 'sine', v * .1, 0, delay, .005);
}

/* ---------- state ---------- */
const S = {
  mode: 'play', t0: 0, dur: 6000, remain: 6, score: 0, shown: 0, combo: 0, lastHit: 0, best: 0,
  mult: 1, game: null, prev: null, shake: 0, flash: 0, flashCol: '#fff', lastSec: 7, beat: 0,
  time: 0, last: 0, round: 0, finishAt: 0, blessT: 0
};
try { S.best = +localStorage.getItem('dopa6best') || 0; } catch (e) {}
let parts = [], rings = [], texts = [];
const E = { timer: $('#timer'), bar: $('#bar'), scv: $('#scv'), combo: $('#combo'), cn: $('#cn') };
let tmCls = '', lastTm = '', lastSc = -1;
const P = { x: 0, y: 0, down: false, type: 'mouse' };

/* ---------- fx helpers ---------- */
function burst(x, y, n, hue, spd = 7, size = 5, o = {}){
  if (parts.length > 350) n = n >> 2;
  for (let i = 0; i < n; i++){
    const a = rnd(0, 6.283), s = rnd(.25, 1) * spd;
    parts.push(Object.assign({ type: 'c', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: .18, drag: .96,
      life: 0, max: rnd(.4, .95), size: rnd(size * .5, size * 1.5), hue: hue + rnd(-30, 30) }, o));
  }
}
function confetti(x, y, n, spd = 12){
  if (parts.length > 350) return;
  for (let i = 0; i < n; i++){
    const a = rnd(-3.14, 0), s = rnd(.3, 1) * spd;
    parts.push({ type: 'conf', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: .28, drag: .97, life: 0, max: rnd(1.2, 2.2),
      size: rnd(6, 12), hue: rnd(0, 360), rot: rnd(0, 6), vr: rnd(-.3, .3) });
  }
}
function ring(x, y, hue, max = 220, w = 6, dur = .5){ rings.push({ x, y, hue, max, w, life: 0, dur }); }
function text(x, y, s, o = {}){
  texts.push({ x, y, s, life: 0, dur: o.dur || .8, size: o.size || 28, hue: o.hue ?? 50, vy: o.vy ?? -60, pop: o.pop ?? 1.6 });
}
function shake(v){ S.shake = Math.max(S.shake, v); }
function flash(col = '#fff', v = 1){ S.flash = v; S.flashCol = col; }

function hit(x, y, base, hue){
  S.combo++; S.lastHit = S.time;
  const mul = (1 + Math.floor(S.combo / 10) * .5) * S.mult;
  const pts = Math.round(base * mul);
  S.score += pts;
  text(x, y - 20, '+' + pts, { hue, size: 22 + Math.min(S.combo, 40) * .6 });
  const n = Math.min(S.combo, 24);
  tone(note(n), .2, 'triangle', .22); tone(note(n) * 2, .12, 'sine', .1);
  if (S.combo % 10 === 0) milestone(x, y);
  const c = E.combo; E.cn.textContent = S.combo; c.classList.add('on');
  c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
  vib(8);
}
function milestone(x, y){
  flash('#fff', .6); shake(16);
  ring(W / 2, H / 2, 50, Math.max(W, H) * .7, 14, .7);
  confetti(W / 2, H * .6, 50);
  text(W / 2, H * .4, S.combo + ' COMBO!!', { size: Math.min(W * .13, 80), hue: rnd(0, 360), dur: 1, pop: 2.4, vy: -30 });
  [0, 4, 7, 12].forEach((s, i) => tone(523 * 2 ** (s / 12), .5, 'sawtooth', .07, 0, i * .04));
  noise(.3, .25, 3000, 'highpass');
}

/* ---------- games ---------- */
function distSeg(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

const TAP = {
  name: '連打！！', hint: '画面をとにかく叩きまくれ',
  init(){ this.k = 1; },
  R(){ return Math.min(W, H) * .2; },
  down(x, y){
    const cx = W / 2, cy = H * .55, hue = (S.combo * 22) % 360;
    this.k = 1.4;
    burst(cx, cy, 16, hue, 9, 6); burst(x, y, 8, hue, 6, 4);
    ring(cx, cy, hue, this.R() * 2.2, 5, .4);
    shake(5 + Math.min(S.combo, 30) * .2);
    hit(cx + rnd(-40, 40), cy - this.R() * 1.15, 20, hue);
    noise(.06, .15, 1800, 'bandpass');
  },
  move(){},
  update(dt){ this.k += (1 - this.k) * Math.min(1, dt * 12); },
  draw(){
    const cx = W / 2, cy = H * .55, R = this.R() * this.k, hue = (S.combo * 22 + S.time * 60) % 360;
    const g = ctx.createRadialGradient(cx - R * .3, cy - R * .3, R * .1, cx, cy, R);
    g.addColorStop(0, `hsl(${hue},100%,85%)`); g.addColorStop(.5, `hsl(${hue},95%,58%)`); g.addColorStop(1, `hsl(${hue + 40},90%,35%)`);
    ctx.fillStyle = `hsla(${hue},100%,60%,.25)`;
    ctx.beginPath(); ctx.arc(cx, cy, R * (1.25 + Math.sin(S.time * 12) * .05), 0, 7); ctx.fill();
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `900 ${R * .5}px var(--font)`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('TAP!', cx, cy);
  }
};

const POP = {
  name: 'バブルはじけ！', hint: '泡を割れ！金色は5倍！',
  init(){ this.b = []; this.sp = 0; for (let i = 0; i < 9; i++) this.spawn(true); },
  spawn(init){
    const s = Math.max(.7, Math.min(1.2, Math.min(W, H) / 600)), gold = Math.random() < .06;
    const r = (gold ? 70 : rnd(32, 62)) * s;
    this.b.push({ x: rnd(r, W - r), y: init ? rnd(H * .3, H) : H + r, r, vy: rnd(90, 200) * (gold ? 1.4 : 1) * (H / 800),
      hue: gold ? 48 : rnd(0, 360), ph: rnd(0, 6.3), gold });
  },
  pop(x, y){
    for (let i = this.b.length - 1; i >= 0; i--){
      const o = this.b[i];
      if (Math.hypot(x - o.x, y - o.y) < o.r * 1.15){
        this.b.splice(i, 1);
        burst(o.x, o.y, o.gold ? 50 : 20, o.hue, o.gold ? 12 : 8, 5);

    const k = r.life / r.dur, a = 1 - k;
    ctx.lineWidth = r.w * a + 1;
    ctx.strokeStyle = bless ? `hsla(${r.hue},100%,65%,${a * .6})` : `hsla(${r.hue},100%,65%,${a})`;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.max * (1 - Math.pow(1 - k, 3)), 0, 7); ctx.stroke();
  }
  for (const p of parts){
    const k = p.life / p.max, a = 1 - k;
    if (p.type === 'c'){
      ctx.fillStyle = `hsla(${p.hue},${p.sat ?? 100}%,${p.sat === 0 ? 55 : 62}%,${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - k * .5), 0, 7); ctx.fill();
    } else if (p.type === 'conf'){
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.life * 8 + p.hue));
      ctx.fillStyle = `hsla(${p.hue},100%,60%,${Math.min(1, a * 2)})`; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
    } else if (p.type === 'half'){
      ctx.globalCompositeOperation = 'source-over';
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang + p.rot); ctx.globalAlpha = Math.min(1, a * 2);
      ctx.fillStyle = `hsl(${p.hue},95%,60%)`; ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI); ctx.fill();
      ctx.fillStyle = `hsl(${p.hue},100%,88%)`; ctx.beginPath(); ctx.arc(0, 0, p.r * .8, 0, Math.PI); ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'lighter';
    } else if (p.type === 'spark'){
      const tw = .5 + .5 * Math.sin(p.life * 6 + p.ph), fade = Math.min(1, k < .1 ? k * 10 : a * 3);
      ctx.fillStyle = `hsla(${p.hue},100%,62%,${fade * (.4 + tw * .6)})`; star(p.x, p.y, p.size * (.6 + tw * .6));
    } else if (p.type === 'petal'){
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + Math.sin(p.life * 2 + p.ph) * .5); ctx.scale(1, .55 + .45 * Math.sin(p.life * 3 + p.ph));
      ctx.fillStyle = `hsla(${p.hue},85%,84%,${Math.min(1, a * 3)})`; ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * .55, 0, 0, 7); ctx.fill(); ctx.restore();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts){
    const k = t.life / t.dur, sc = 1 + Math.max(0, 1 - k * 6) * (t.pop - 1), a = k > .7 ? (1 - k) / .3 : 1;
    ctx.save(); ctx.translate(t.x, t.y); ctx.scale(sc, sc); ctx.globalAlpha = Math.max(0, a);
    ctx.font = `900 ${t.size}px var(--font)`; ctx.lineWidth = t.size * .16; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineJoin = 'round';
    ctx.strokeText(t.s, 0, 0); ctx.fillStyle = `hsl(${t.hue},100%,68%)`; ctx.fillText(t.s, 0, 0); ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => {
  audio(); P.x = e.clientX; P.y = e.clientY; P.down = true; P.type = e.pointerType || 'mouse';
  if (S.mode === 'play') S.game.down(P.x, P.y);
});
cv.addEventListener('pointermove', e => {
  P.x = e.clientX; P.y = e.clientY; P.type = e.pointerType || 'mouse';
  if (S.mode === 'play') S.game.move(P.x, P.y, P.down);
});
addEventListener('pointerup', () => { P.down = false; });
addEventListener('pointercancel', () => { P.down = false; });
document.addEventListener('contextmenu', e => e.preventDefault());

$('#yes').addEventListener('click', () => { audio(); startBless(); });
$('#no').addEventListener('click', () => {
  audio(); $('#result').classList.remove('show'); startRound(true);
});
$('#again').addEventListener('click', () => {
  audio(); $('#bless').classList.remove('show'); startRound(false);
});

/* ---------- go! ---------- */
S.last = performance.now();
startRound(false);
requestAnimationFrame(frame);
</script>
</body>
